name: Update market data

on:
  schedule:
    - cron: "40 12-21 * * 1-5"
    - cron: "40 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: pip install -r tools/requirements.txt
      - name: Download data
        run: python tools/update_data.py
      - name: Save data file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/market.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update market data"
            git push
          fi
